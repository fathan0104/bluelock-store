<style>
    /* Modal Backdrop */
    .modal-backdrop {
        backdrop-filter: blur(8px);
        background: rgba(10, 17, 40, 0.8);
    }

    /* Modal Container */
    .modal-container {
        background: linear-gradient(to bottom, #0f1629, #0a1128);
        border: 2px solid #00d4ff;
        box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
    }

    /* Modal Header */
    .modal-header {
        border-bottom: 2px solid #1e3a8a;
        background: rgba(30, 58, 138, 0.2);
    }

    /* Form Input Style */
    .bluelock-input {
        background: #0a1128;
        border: 2px solid #1e3a8a;
        color: #e2e8f0;
        transition: all 0.3s ease;
    }

    .bluelock-input:focus {
        outline: none;
        border-color: #00d4ff;
        box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }

    .bluelock-input::placeholder {
        color: #94a3b8;
    }

    /* Select Dropdown */
    .bluelock-select {
        background: #0a1128;
        border: 2px solid #1e3a8a;
        color: #e2e8f0;
        transition: all 0.3s ease;
    }

    .bluelock-select:focus {
        outline: none;
        border-color: #00d4ff;
        box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }

    .bluelock-select option {
        background: #0a1128;
        color: #e2e8f0;
    }

    /* Checkbox */
    .bluelock-checkbox {
        background: #0a1128;
        border: 2px solid #1e3a8a;
        width: 20px;
        height: 20px;
    }

    .bluelock-checkbox:checked {
        background: linear-gradient(135deg, #00d4ff, #1e3a8a);
        border-color: #00d4ff;
    }

    /* Label Style */
    .form-label {
        color: #94a3b8;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.5px;
    }

    /* Button Styles */
    .btn-cancel {
        background: #0f1629;
        border: 2px solid #1e3a8a;
        color: #e2e8f0;
        transition: all 0.3s ease;
    }

    .btn-cancel:hover {
        border-color: #00d4ff;
        color: #00d4ff;
        box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }

    .btn-submit {
        background: linear-gradient(135deg, #00d4ff, #1e3a8a);
        border: 2px solid #00d4ff;
        color: white;
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        transition: all 0.3s ease;
        font-weight: 600;
    }

    .btn-submit:hover {
        box-shadow: 0 0 30px #00d4ff, 0 0 40px rgba(0, 212, 255, 0.5);
        transform: translateY(-2px);
    }

    /* Close Button */
    .close-btn {
        color: #94a3b8;
        transition: all 0.3s ease;
    }

    .close-btn:hover {
        color: #00d4ff;
        background: rgba(0, 212, 255, 0.1);
    }

    /* Title Glow */
    .modal-title {
        color: #00d4ff;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }

    /* Modal Footer */
    .modal-footer {
        border-top: 2px solid #1e3a8a;
        background: rgba(30, 58, 138, 0.1);
    }
</style>

<!-- Modal -->
<div id="crudModal" class="modal-backdrop hidden fixed inset-0 z-50 w-full flex items-center justify-center">
    <div id="crudModalContent"
        class="modal-container rounded-xl shadow-2xl w-5/6 sm:w-3/5 md:w-1/2 lg:w-2/5 xl:w-1/3 max-h-[90vh] overflow-y-auto opacity-0 scale-95 transition-all duration-300">
        
        <!-- Modal header -->
        <div class="modal-header flex items-center justify-between p-6">
            <div>
                <h3 class="modal-title text-2xl font-bold">
                    ⚡ CREATE NEW PRODUCT
                </h3>
                <p class="text-sm text-gray-400 mt-1">Share your football product with others</p>
            </div>
            <button type="button"
                class="close-btn rounded-lg text-sm p-2 ml-auto inline-flex items-center"
                onclick="hideModal()">
                <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                        clip-rule="evenodd"></path>
                </svg>
                <span class="sr-only">Close modal</span>
            </button>
        </div>

        <!-- Modal body -->
        <div class="px-6 py-4 space-y-4">
            <form id="productForm">
                <div class="mb-4">
                    <label for="name" class="form-label block mb-2">Product Name</label>
                    <input type="text" id="name" name="name"
                        class="bluelock-input block w-full rounded-md px-4 py-3"
                        placeholder="Enter product name" required>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label block mb-2">Description</label>
                    <textarea id="description" name="description" rows="4"
                        class="bluelock-input block w-full rounded-md px-4 py-3"
                        placeholder="Enter product description" required></textarea>
                </div>

                <div class="mb-4">
                    <label for="category" class="form-label block mb-2">Category</label>
                    <select id="category" name="category"
                        class="bluelock-select block w-full rounded-md px-4 py-3" required>
                        <option value="">Choose a category</option>
                        <option value="ball">⚽ Ball</option>
                        <option value="shoes">👟 Shoes</option>
                        <option value="shirt">👕 Shirt</option>
                        <option value="sock">🧦 Sock</option>
                        <option value="jersey">🏃 Jersey</option>
                        <option value="bag">🎒 Bag</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="price" class="form-label block mb-2">Price</label>
                        <input type="number" id="price" name="price" min="0" step="0.01"
                            class="bluelock-input block w-full rounded-md px-4 py-3" placeholder="0.00" required>
                    </div>
                    <div>
                        <label for="stock" class="form-label block mb-2">Stock</label>
                        <input type="number" id="stock" name="stock" min="0"
                            class="bluelock-input block w-full rounded-md px-4 py-3" placeholder="0" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="thumbnail" class="form-label block mb-2">Thumbnail URL</label>
                    <input type="url" id="thumbnail" name="thumbnail"
                        class="bluelock-input block w-full rounded-md px-4 py-3"
                        placeholder="https://example.com/image.jpg">
                </div>

                <div class="mb-4">
                    <div class="flex items-center">
                        <input id="is_featured" name="is_featured" type="checkbox"
                            class="bluelock-checkbox rounded">
                        <label for="is_featured" class="ml-3 text-sm font-medium text-gray-300">⭐ Mark as Featured Product</label>
                    </div>
                </div>
            </form>
        </div>

        <!-- Modal footer -->
        <div class="modal-footer flex flex-col sm:flex-row gap-3 p-6">
            <button type="button" id="cancelButton"
                class="btn-cancel order-2 sm:order-1 px-6 py-3 rounded-lg font-medium text-center"
                onclick="hideModal()">Cancel</button>
            <button type="submit" id="submitProduct" form="productForm"
                class="btn-submit order-1 sm:order-2 flex-1 px-6 py-3 rounded-lg">
                🚀 Publish Product
            </button>
        </div>
    </div>
</div>

<script>
    function showModal() {
        const modal = document.getElementById('crudModal');
        const modalContent = document.getElementById('crudModalContent');

        modal.classList.remove('hidden');
        setTimeout(() => {
            modalContent.classList.remove('opacity-0', 'scale-95');
            modalContent.classList.add('opacity-100', 'scale-100');
        }, 50);
    }

    function hideModal() {
        const modal = document.getElementById('crudModal');
        const modalContent = document.getElementById('crudModalContent');

        modalContent.classList.remove('opacity-100', 'scale-100');
        modalContent.classList.add('opacity-0', 'scale-95');

        setTimeout(() => {
            modal.classList.add('hidden');
        }, 150);
    }

    async function addProductEntry() {
        await fetch("{% url 'main:add_product_entry_ajax' %}", {
            method: "POST",
            body: new FormData(document.querySelector('#productForm')),
        });

        document.getElementById("productForm").reset();
        hideModal();

        // Show toast notification
        showToast('Product added successfully!', '', 'success');

        // Dispatch custom event to notify main.html about new data
        document.dispatchEvent(new CustomEvent('productAdded'));

        return false;
    }

    // FIX: pastikan listener hanya dipasang sekali
    const form = document.getElementById("productForm");
    if (!form.dataset.bound) {
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            addProductEntry();
        });
        form.dataset.bound = "true";
    }
</script>
